name: CI — Type + Cert Gate

# WHY THIS EXISTS (separate from deploy.yml):
#   deploy.yml's `test` job runs Python pytest against calc-service —
#   but calc-service is NOT what ships. The live, production,
#   shadow-running engine is the TypeScript `manualJ8-ts-1.1.0`, and
#   its 43-case vitest cert suite (Smith/Walker/Cobb within 0.5% ACCA
#   tolerance) plus both tsc checks were gated NOWHERE. A tired session
#   could ship accuracy drift straight onto permit-binding documents
#   with nothing red-flagging it.
#
#   This workflow gates exactly the artifacts that ship:
#     - workers/  : tsc --noEmit (Cloudflare Worker — the API)
#                 + tenant-scoping guard (D1 has no RLS — this is the
#                   machine check that every org-owned query is org_id-scoped;
#                   see workers/scripts/check-tenant-scoping.mjs)
#     - frontend/ : tsc -b + vitest run (the app + the cert engine)
#
#   It deliberately does NOT deploy. Frontend auto-deploys via
#   Cloudflare Pages from main; the Worker deploys via manual
#   `wrangler deploy` after review. Auto-deploy from CI is itself a
#   drift risk and is intentionally out of scope. This is a GATE,
#   not a pipeline.
#
#   Runs on push to main (Nathan pushes directly to trunk) and on PRs
#   to main. Any red job fails the check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so the latest push is the
# one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-typecheck:
    name: Worker — tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - name: Install (workers)
        working-directory: workers
        run: npm ci
      - name: Type-check worker
        working-directory: workers
        run: npx tsc --noEmit -p tsconfig.json

  tenant-scoping:
    name: Worker — tenant-scoping guard
    runs-on: ubuntu-latest
    # D1 has no row-level security. This is the app-layer backstop: every
    # D1 query touching an org-owned table must be scoped by org_id (or
    # carry a documented inline waiver). Zero deps — no npm install needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tenant-scoping guard
        working-directory: workers
        run: node scripts/check-tenant-scoping.mjs

  worker-tests:
    name: Worker — tenant-isolation integration tests
    runs-on: ubuntu-latest
    # The tenant-scoping guard above proves every org-owned query HAS an
    # org_id clause. It cannot prove the clause is CORRECT (bound from the
    # session-derived org, not a client value or a leaky join). This job is
    # the other half: it boots the REAL Hono worker inside workerd (via
    # @cloudflare/vitest-pool-workers + a Miniflare D1), applies migrations
    # 0001-0011, mints REAL sessions, and asserts org-B gets 404 — not 403,
    # not data — on every org-A strict-table row, with a negative control
    # proving the 404 is tenancy (org-A reads the same ids). It also checks
    # the cross-tenant-by-design routes (platform/forum/permits/audit) still
    # behave as designed. See workers/test/.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - name: Install (workers)
        working-directory: workers
        run: npm ci
      - name: Run worker integration tests
        working-directory: workers
        run: npm test

  frontend-gate:
    name: Frontend — tsc + cert vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install (frontend)
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b
      - name: Cert + unit vitest (43/43, ACCA 0.5% tolerance)
        working-directory: frontend
        run: npx vitest run
