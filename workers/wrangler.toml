name = "hvac-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e923bf772f49580f54b7b5dc7910e32f"

[vars]
ENVIRONMENT = "production"
AZURE_CLIENT_ID = "e0e0d219-e48b-49b5-b86d-40fbaaf78fde"
CF_ACCESS_CLIENT_ID = "949b317683ac7e62be218c9a642d99b0b191c8ba17f0d426f1c3ddcfbea54067"
CF_ACCESS_ISSUER = "https://c4tech.cloudflareaccess.com/cdn-cgi/access/sso/oidc/949b317683ac7e62be218c9a642d99b0b191c8ba17f0d426f1c3ddcfbea54067"

# Feedback routing — comma-separated email addresses.
# Bug reports go to BOTH addresses (redundant, time-critical delivery).
# Suggestions/questions go to the support address only.
FEEDBACK_BUG_EMAILS = "ngriffith@c4tech.dev,support@c4tech.co"
FEEDBACK_SUPPORT_EMAIL = "support@c4tech.co"
FEEDBACK_FROM_ADDRESS = "HVAC DesignPro <noreply@c4tech.co>"

[[d1_databases]]
binding = "DB"
database_name = "hvac-design-pro"
database_id = "9ad753c8-542b-4575-b488-ad4718bd7f7d"

# Scheduled tasks. Today only the permit lifecycle auto-expire sweep runs.
# Every 5 minutes scans permit_submissions for expires_at < now AND status
# IN ('approved','suspended'), transitions them to 'expired'.
[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hvac-assets"

[env.dev]
name = "hvac-api-dev"

[env.dev.vars]
ENVIRONMENT = "development"
FEEDBACK_BUG_EMAILS = "ngriffith@c4tech.dev"
FEEDBACK_SUPPORT_EMAIL = "ngriffith@c4tech.dev"
FEEDBACK_FROM_ADDRESS = "HVAC DesignPro Dev <noreply@c4tech.co>"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "hvac-design-pro-dev"
database_id = "placeholder-dev"

[[env.dev.r2_buckets]]
binding = "STORAGE"
bucket_name = "hvac-assets-dev"

# ── Test environment ───────────────────────────────────────────────────────
# Used ONLY by the vitest integration-test harness (vitest.config.ts →
# @cloudflare/vitest-pool-workers). The pool runs the worker inside workerd
# with a Miniflare-simulated D1 + R2, so these bindings resolve to local,
# in-memory, per-run stores — the database_id is a placeholder and never hits
# the real Cloudflare D1. Migrations 0001-0011 are applied to this DB in
# test/helpers/harness.ts. Never deployed.
[env.test]
name = "hvac-api-test"

[env.test.vars]
ENVIRONMENT = "test"
# Mirror the top-level vars (wrangler does NOT inherit [vars] into named
# environments). Values are inert in the test runtime — no email is sent, no
# SSO runs — but declaring them keeps the config-load warning-free.
AZURE_CLIENT_ID = "test"
CF_ACCESS_CLIENT_ID = "test"
CF_ACCESS_ISSUER = "https://test.invalid"
FEEDBACK_BUG_EMAILS = "test@test.invalid"
FEEDBACK_SUPPORT_EMAIL = "test@test.invalid"
FEEDBACK_FROM_ADDRESS = "Test <noreply@test.invalid>"

[[env.test.d1_databases]]
binding = "DB"
database_name = "hvac-design-pro-test"
database_id = "placeholder-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "hvac-assets-test"
