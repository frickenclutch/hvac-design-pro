<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <!-- mobile-web-app-capable is the modern name; apple-mobile-web-app-capable
         is the legacy alias still consumed by iOS Safari. Keep both for now
         so iOS home-screen install stays as standalone PWA, but the modern
         tag silences the Chromium deprecation warning. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DesignPro" />

    <!-- Icons — gear-vortex emblem pack (public/icons + apple-touch + ico) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <meta name="description" content="Professional HVAC load calculation, duct design, and CAD workspace. ACCA Manual J/D/S compliant." />
    <title>HVAC DesignPro</title>
    <!-- A white-labelled tenant's tab should never flash the platform name
         while the bundle loads. Reads the same cached branding the app paints
         from; assigns document.title (text, never markup). -->
    <script>
      try {
        var b = null;
        var org = JSON.parse(localStorage.getItem('hvac_session_org') || 'null');
        if (org && typeof org.id === 'string') {
          b = JSON.parse(localStorage.getItem('hvac_branding_' + org.id) || 'null');
        } else {
          var q = new URLSearchParams(location.search);
          var slug = q.has('org') ? (q.get('org') || '').trim().toLowerCase() : localStorage.getItem('hvac_signin_org');
          if (slug && /^[a-z0-9][a-z0-9-]{0,62}$/.test(slug)) {
            var c = JSON.parse(localStorage.getItem('hvac_branding_public_' + slug) || 'null');
            b = c && c.branding;
          }
        }
        if (b && b.whiteLabel === true && typeof b.displayName === 'string' && b.displayName.trim()) {
          document.title = b.displayName.slice(0, 60);
        }
      } catch (e) { /* keep the default title */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
